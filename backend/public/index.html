<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAFE SOLUTIONS — Fleet & Smart Attendance API</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: rgba(18, 26, 43, 0.85);
      --primary: #3b82f6;
      --accent: #10b981;
      --text: #f3f4f6;
      --text-dim: #9ca3af;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e293b, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: var(--card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 0.75rem;
    }
    p {
      color: var(--text-dim);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    .endpoints {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      text-align: left;
      margin-bottom: 2rem;
    }
    .endpoint-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.85rem;
      font-family: monospace;
    }
    .endpoint-item:last-child { border-bottom: none; }
    .method {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-weight: 700;
    }
    .btn {
      display: inline-block;
      background: var(--primary);
      color: white;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span class="pulse-dot"></span>
      API Online & Operational
    </div>
    <h1>SAFE SOLUTIONS REST API</h1>
    <p>Fleet Management & Smart Attendance System Backend is live and connected to Neon PostgreSQL Database.</p>
    
    <div class="endpoints">
      <div class="endpoint-item">
        <span class="method">GET</span>
        <span>/api/v1/health</span>
      </div>
      <div class="endpoint-item">
        <span class="method">POST</span>
        <span>/api/v1/auth/login</span>
      </div>
      <div class="endpoint-item">
        <span class="method">GET</span>
        <span>/api/v1/employees</span>
      </div>
      <div class="endpoint-item">
        <span class="method">POST</span>
        <span>/api/v1/attendance/submit</span>
      </div>
      <div class="endpoint-item">
        <span class="method">GET</span>
        <span>/api/v1/vehicles</span>
      </div>
    </div>

    <a href="/api/v1/health" class="btn">Check Live Health Status</a>
  </div>
</body>
</html>
